# pages.yml — Planet-Viewer moved to Game-Template-and-Library on 7 Nov 2026 (labs/planet-viewer, with this repository's
# history). On main this publishes, at the old site's root, a page that sends every old address to the same place on the
# new site (.github/moved.sh); the kept copies stay. The repository is frozen: nothing else happens here.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/moved.sh /Planet-Viewer/ https://william-are-buzbee.github.io/Game-Template-and-Library/labs/planet-viewer/
